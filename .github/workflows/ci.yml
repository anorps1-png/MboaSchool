name: CI

on:
  push:
    branches: [main, master, frontend-prototype]
  pull_request:
    branches: [main, master, frontend-prototype]

# Annule les exécutions précédentes encore en cours sur la même branche
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Typecheck · Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Bloquant : aucune vulnérabilité critique connue dans les dépendances
      # de production actuellement (vérifié 2026-08-25). Les vulnérabilités
      # critiques/hautes existantes (vitest, tar, next) sont soit dev-only,
      # soit déjà documentées dans PRODUCTION_READINESS.md — ce step protège
      # seulement contre une NOUVELLE régression critique en prod.
      - name: Audit dépendances (production, bloquant sur critique)
        run: npm audit --omit=dev --audit-level=critical

      # Non bloquant : visibilité sur l'ensemble (dev inclus) sans casser la
      # CI tant que les vulnérabilités déjà connues ne sont pas résorbées.
      - name: Audit dépendances (complet, informatif)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests unitaires
        run: npm test

  build:
    name: Build Next.js
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # Valeurs factices : le build ne fait aucun appel réseau, il a juste
        # besoin que les variables publiques soient définies.
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
        run: npm run build
